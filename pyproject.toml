[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "german-news-classifier"
version = "0.1.0"
description = "German news topic classification: TF-IDF baseline, fine-tuned BERT and a zero-shot LLM compared on one test set"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.40",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
